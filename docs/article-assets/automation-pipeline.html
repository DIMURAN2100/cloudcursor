<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自动化流水线</title>
<style>
  :root{--bg:#0b1220;--fg:#e6edf7;--muted:#93a4bd;--line:#2a3a55;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 "Inter","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  main{max-width:1280px;margin:0 auto;padding:40px 48px}
  h1{font-size:26px;margin:0 0 6px;font-weight:700}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  svg{width:100%;height:auto;display:block}
  .lane{fill:rgba(56,189,248,.04);stroke:var(--line);stroke-width:1;stroke-dasharray:6 5}
  .lane-label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:var(--muted)}
  .step-title{font-size:13.5px;font-weight:700;fill:#fff}
  .step-sub{font-size:11px;fill:rgba(255,255,255,.75)}
  .time{font-size:11px;fill:#fcd34d;font-family:ui-monospace,Consolas,monospace;font-weight:700}
  .arrow{stroke:var(--accent);stroke-width:2;fill:none}
  .arrow2{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
</style>
<main>
  <h1>每日自动化流水线（东八区）</h1>
  <p class="sub">两条 Automation 解耦：简报发布走 <code style="color:#7dd3fc">AI安全新闻</code> 分支，站点智能加工走 <code style="color:#7dd3fc">main</code> 分支；最终由 GitHub Actions 构建发布。</p>

<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Lane 1: Briefing production -->
  <rect class="lane" x="30" y="60" width="1140" height="150" rx="14"/>
  <text class="lane-label" x="50" y="86">PIPELINE A · 简报生产</text>
  <text x="50" y="106" font-size="15" font-weight="700" fill="#fff">Cursor Automation · 分支 AI安全新闻</text>

  <!-- steps row 1 -->
  <g>
    <rect x="50" y="125" width="170" height="70" rx="10" fill="#0369a1"/>
    <text class="time" x="62" y="145">08:00 定时</text>
    <text class="step-title" x="62" y="165">多源抓取 + AI 摘要</text>
    <text class="step-sub" x="62" y="183">Cloud Agent 生成简报正文</text>
  </g>
  <g>
    <rect x="245" y="125" width="160" height="70" rx="10" fill="#075985"/>
    <text class="time" x="257" y="145">08:30</text>
    <text class="step-title" x="257" y="165">人工校对</text>
    <text class="step-sub" x="257" y="183">核事实、修标题、删水稿</text>
  </g>
  <g>
    <rect x="430" y="125" width="220" height="70" rx="10" fill="#0e7490"/>
    <text class="time" x="442" y="145">09:00</text>
    <text class="step-title" x="442" y="165">publish-ai-briefing.sh</text>
    <text class="step-sub" x="442" y="183">commit + push → origin/AI安全新闻</text>
  </g>
  <g>
    <rect x="675" y="125" width="220" height="70" rx="10" fill="#155e75"/>
    <text class="time" x="687" y="145">09:05</text>
    <text class="step-title" x="687" y="165">briefings/YYYY-MM-DD-*.md</text>
    <text class="step-sub" x="687" y="183">入库，可被任意分支 fetch</text>
  </g>
  <g>
    <rect x="920" y="125" width="220" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="time" x="932" y="145">09:05+</text>
    <text class="step-title" x="932" y="165">触发 Pipeline B</text>
    <text class="step-sub" x="932" y="183">main 分支 Automation 被唤醒</text>
  </g>

  <!-- connector down -->
  <path class="arrow" d="M1030,195 L1030,235 L1030,250" marker-end="url(#a)"/>

  <!-- Lane 2: Site intelligence -->
  <rect class="lane" x="30" y="250" width="1140" height="170" rx="14"/>
  <text class="lane-label" x="50" y="276">PIPELINE B · 站点智能加工</text>
  <text x="50" y="296" font-size="15" font-weight="700" fill="#fff">Cursor Automation · 分支 main</text>

  <g>
    <rect x="50" y="315" width="200" height="80" rx="10" fill="#5b21b6"/>
    <text class="time" x="62" y="335">09:30</text>
    <text class="step-title" x="62" y="355">sync-briefings-to-site.sh</text>
    <text class="step-sub" x="62" y="373">git fetch AI安全新闻</text>
    <text class="step-sub" x="62" y="387">checkout briefings/ 到 main</text>
  </g>
  <g>
    <rect x="275" y="315" width="250" height="80" rx="10" fill="#6d28d9"/>
    <text class="time" x="287" y="335">09:31</text>
    <text class="step-title" x="287" y="355">Cloud Agent 阅读当日简报</text>
    <text class="step-sub" x="287" y="373">headline + execSummary</text>
    <text class="step-sub" x="287" y="387">classifications + glossary 增量</text>
  </g>
  <g>
    <rect x="550" y="315" width="220" height="80" rx="10" fill="#4c1d95"/>
    <text class="time" x="562" y="335">09:33</text>
    <text class="step-title" x="562" y="355">写入 data/enrichment/</text>
    <text class="step-sub" x="562" y="373">daily/2026-08-10.json</text>
    <text class="step-sub" x="562" y="387">glossary.json（按需）</text>
  </g>
  <g>
    <rect x="795" y="315" width="190" height="80" rx="10" fill="#7c3aed"/>
    <text class="time" x="807" y="335">09:35</text>
    <text class="step-title" x="807" y="355">npm run build</text>
    <text class="step-sub" x="807" y="373">preflight: check-content.ts</text>
    <text class="step-sub" x="807" y="387">失败则修复，不提交</text>
  </g>
  <g>
    <rect x="1010" y="315" width="140" height="80" rx="10" fill="#5b21b6"/>
    <text class="time" x="1022" y="335">09:36</text>
    <text class="step-title" x="1022" y="355">commit + push</text>
    <text class="step-sub" x="1022" y="373">到 main 分支</text>
  </g>

  <!-- connector to lane 3 -->
  <path class="arrow" d="M1080,395 L1080,440 L1080,455" marker-end="url(#a)"/>

  <!-- Lane 3: Deploy -->
  <rect class="lane" x="30" y="455" width="1140" height="70" rx="14"/>
  <text class="lane-label" x="50" y="478">PIPELINE C · 发布</text>

  <g>
    <rect x="50" y="485" width="320" height="32" rx="8" fill="#047857"/>
    <text class="step-title" x="62" y="506">GitHub Actions: deploy-pages.yml</text>
  </g>
  <g>
    <rect x="390" y="485" width="220" height="32" rx="8" fill="#047857"/>
    <text class="step-title" x="402" y="506">npm ci &amp;&amp; npm run build</text>
  </g>
  <g>
    <rect x="630" y="485" width="240" height="32" rx="8" fill="#047857"/>
    <text class="step-title" x="642" y="506">upload-pages-artifact</text>
  </g>
  <g>
    <rect x="890" y="485" width="260" height="32" rx="8" fill="#065f46"/>
    <text class="step-title" x="902" y="506">deploy-pages → 公网可访问</text>
  </g>
</svg>
</main>
