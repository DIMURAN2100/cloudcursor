<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系统架构</title>
<style>
  :root {
    --bg:#0b1220; --panel:#111b2e; --fg:#e6edf7; --muted:#93a4bd;
    --line:#2a3a55; --accent:#38bdf8; --accent2:#a78bfa;
    --content:#0ea5e9; --agent:#7c3aed; --build:#0891b2; --deploy:#059669; --risk:#f43f5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 "Inter","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  main{max-width:1280px;margin:0 auto;padding:40px 48px}
  h1{font-size:26px;margin:0 0 6px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:32px}
  svg{width:100%;height:auto;display:block}
  .layer-label{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:var(--muted)}
  .layer-title{font-size:18px;font-weight:700;fill:var(--fg)}
  .layer-sub{font-size:12px;fill:var(--muted)}
  .box-title{font-size:14px;font-weight:700;fill:#fff}
  .box-sub{font-size:11.5px;fill:rgba(255,255,255,.78)}
  .chip{font-size:11px;fill:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .arrow{stroke:var(--accent);stroke-width:2;fill:none}
  .arrow-soft{stroke:#475569;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
  .zone{fill:rgba(56,189,248,.04);stroke:var(--line);stroke-width:1;stroke-dasharray:6 5}
  .pill{font-size:11px;fill:#fff;font-weight:600}
</style>
<main>
  <h1>cloudcursor · 系统架构</h1>
  <p class="sub">四层分离：内容是人写的 Markdown，智能是云端 Agent 语义加工，站点是纯静态 Astro，分发走 GitHub Pages — 零运行时服务器。</p>

<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Layer 1: Content -->
  <rect class="zone" x="30" y="70" width="1140" height="130" rx="14"/>
  <text class="layer-label" x="50" y="98">LAYER 01 · CONTENT</text>
  <text class="layer-title" x="50" y="120">内容层 · 人 + AI 协作产出</text>
  <text class="layer-sub" x="50" y="140">每天一份 Markdown，存在仓库，谁都能 git diff</text>

  <g>
    <rect x="50" y="155" width="220" height="32" rx="8" fill="#0369a1"/>
    <text class="box-title" x="62" y="176">① Cloud Agent 生成初稿</text>
    <text class="box-sub" x="62" y="190">多源抓取 → 去重 → 中文摘要</text>
  </g>
  <g>
    <rect x="290" y="155" width="220" height="32" rx="8" fill="#0369a1"/>
    <text class="box-title" x="302" y="176">② 人工校对</text>
    <text class="box-sub" x="302" y="190">修正事实 / 重写要点 / 删水稿</text>
  </g>
  <g>
    <rect x="530" y="155" width="260" height="32" rx="8" fill="#0e7490"/>
    <text class="box-title" x="542" y="176">briefings/YYYY-MM-DD-*.md</text>
    <text class="box-sub" x="542" y="190">103 期 · 190+ 条结构化要点</text>
  </g>
  <g>
    <rect x="810" y="155" width="330" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text class="box-title" x="822" y="176">Git 分支：AI安全新闻</text>
    <text class="box-sub" x="822" y="190">publish-ai-briefing.sh 直推 origin</text>
  </g>

  <!-- arrows L1 down -->
  <path class="arrow" d="M660,205 L660,235" marker-end="url(#arr)"/>

  <!-- Layer 2: Enrichment (Agent) -->
  <rect class="zone" x="30" y="240" width="1140" height="150" rx="14"/>
  <text class="layer-label" x="50" y="268">LAYER 02 · INTELLIGENCE</text>
  <text class="layer-title" x="50" y="290">智能加工层 · Cursor Automation + Cloud Agent</text>
  <text class="layer-sub" x="50" y="310">定时跑在云端 VM；不改原文，只生成 JSON 增量；构建失败不提交</text>

  <g>
    <rect x="50" y="325" width="260" height="50" rx="10" fill="#5b21b6"/>
    <text class="box-title" x="64" y="348">sync-briefings-to-site.sh</text>
    <text class="box-sub" x="64" y="366">从 AI安全新闻 分支拉最新 briefings/</text>
  </g>
  <g>
    <rect x="330" y="325" width="320" height="50" rx="10" fill="#6d28d9"/>
    <text class="box-title" x="344" y="348">Cloud Agent 语义加工</text>
    <text class="box-sub" x="344" y="366">头条 / 管理层摘要 / 归类纠错 / 术语补充</text>
  </g>
  <g>
    <rect x="670" y="325" width="230" height="50" rx="10" fill="#4c1d95"/>
    <text class="box-title" x="684" y="348">data/enrichment/daily/*.json</text>
    <text class="box-sub" x="684" y="366">headline + execSummary + classifications</text>
  </g>
  <g>
    <rect x="920" y="325" width="220" height="50" rx="10" fill="#4c1d95"/>
    <text class="box-title" x="934" y="348">data/enrichment/glossary.json</text>
    <text class="box-sub" x="934" y="366">术语墙：term/en/definition/theme</text>
  </g>

  <path class="arrow" d="M660,395 L660,425" marker-end="url(#arr)"/>

  <!-- Layer 3: Build (Astro) -->
  <rect class="zone" x="30" y="430" width="1140" height="130" rx="14"/>
  <text class="layer-label" x="50" y="458">LAYER 03 · BUILD</text>
  <text class="layer-title" x="50" y="480">构建层 · Astro 静态站点生成</text>
  <text class="layer-sub" x="50" y="500">build 时一次性把 Markdown + JSON + taxonomy.ts 编译成 HTML，无服务端、无数据库</text>

  <g>
    <rect x="50" y="515" width="200" height="32" rx="8" fill="#0e7490"/>
    <text class="box-title" x="62" y="536">briefings.ts 解析</text>
    <text class="box-sub" x="62" y="550">标题/要点/来源/slug</text>
  </g>
  <g>
    <rect x="270" y="515" width="220" height="32" rx="8" fill="#0e7490"/>
    <text class="box-title" x="282" y="536">taxonomy.ts 规则归类</text>
    <text class="box-sub" x="282" y="550">4 主题 × 14 维度 + 7 地区</text>
  </g>
  <g>
    <rect x="510" y="515" width="230" height="32" rx="8" fill="#0891b2"/>
    <text class="box-title" x="522" y="536">enrichment 语义层叠加</text>
    <text class="box-sub" x="522" y="550">覆盖错分 / 注入头条与摘要</text>
  </g>
  <g>
    <rect x="760" y="515" width="370" height="32" rx="8" fill="#155e75"/>
    <text class="box-title" x="772" y="536">web/dist/  → HTML + CSS + RSS + sitemap + search-index.json</text>
    <text class="box-sub" x="772" y="550">prebuild 跑 check-content.ts，破损链接/缺字段直接 fail</text>
  </g>

  <path class="arrow" d="M660,565 L660,595" marker-end="url(#arr)"/>

  <!-- Layer 4: Deploy -->
  <rect class="zone" x="30" y="600" width="1140" height="100" rx="14"/>
  <text class="layer-label" x="50" y="628">LAYER 04 · DELIVERY</text>
  <text class="layer-title" x="50" y="650">分发层 · GitHub Pages（零服务器成本）</text>

  <g>
    <rect x="50" y="660" width="280" height="28" rx="8" fill="#047857"/>
    <text class="box-title" x="62" y="679">push 到 main</text>
  </g>
  <g>
    <rect x="350" y="660" width="320" height="28" rx="8" fill="#047857"/>
    <text class="box-title" x="362" y="679">GitHub Actions: deploy-pages.yml</text>
  </g>
  <g>
    <rect x="690" y="660" width="440" height="28" rx="8" fill="#065f46"/>
    <text class="box-title" x="702" y="679">https://dimuran2100.github.io/cloudcursor/  (全球 CDN，HTTPS)</text>
  </g>

  <!-- side annotation: cost -->
  <g>
    <rect x="990" y="70" width="180" height="56" rx="10" fill="rgba(244,63,94,.12)" stroke="#f43f5e" stroke-width="1"/>
    <text x="1004" y="93" font-size="12" fill="#fda4af" font-weight="700">运行时成本</text>
    <text x="1004" y="113" font-size="14" fill="#fff" font-weight="700">$0 / 月</text>
    <text x="1004" y="126" font-size="11" fill="#fda4af">仅 Cursor 订阅 + GitHub 免费额度</text>
  </g>
</svg>
</main>
